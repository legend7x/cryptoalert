name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip python3-venv \
            autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev build-essential ccache
          python3 -m pip install --user 'buildozer>=1.5.0' 'cython==0.29.34'
      - name: Build APK
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          yes | buildozer -v android debug || { status=${PIPESTATUS[1]}; exit "$status"; }
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CryptoAlert-APK
          path: bin/*.apk
          if-no-files-found: error
